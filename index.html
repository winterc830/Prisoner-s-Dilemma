<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>囚徒困境對戰</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #f7f6f3;
    --surface:  #ffffff;
    --border:   rgba(0,0,0,0.12);
    --text:     #1a1a1a;
    --muted:    #6b6b6b;
    --hint:     #a0a0a0;
    --purple:   #534AB7;
    --purple-l: #EEEDFE;
    --purple-d: #3C3489;
    --teal:     #1D9E75;
    --teal-l:   #E1F5EE;
    --teal-d:   #085041;
    --red-l:    #FCEBEB;
    --red-d:    #791F1F;
    --amber-l:  #FAEEDA;
    --amber-d:  #412402;
    --amber:    #EF9F27;
    --radius:   10px;
    --radius-sm:6px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }

  #app { width: 100%; max-width: 480px; }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
  }

  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.6; }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; letter-spacing: .04em; }

  input[type=text], input[type=password] {
    width: 100%;
    height: 40px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 12px;
    font-size: 14px;
    color: var(--text);
    background: var(--surface);
    margin-bottom: 1rem;
    outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(83,74,183,.12); }

  .btn {
    width: 100%;
    height: 42px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--purple); color: #fff; margin-bottom: 10px; }
  .btn-primary:hover { background: var(--purple-d); }
  .btn-secondary { background: transparent; border: 0.5px solid var(--border); color: var(--text); margin-bottom: 10px; }
  .btn-secondary:hover { background: var(--bg); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .divider { display: flex; align-items: center; gap: 10px; margin: 1rem 0; }
  .divider hr { flex: 1; border: none; border-top: 0.5px solid var(--border); }
  .divider span { font-size: 12px; color: var(--hint); }

  .error {
    background: var(--red-l); color: var(--red-d);
    border-radius: var(--radius-sm); padding: 9px 12px;
    font-size: 13px; margin-bottom: 1rem; display: none;
  }

  .room-code {
    font-size: 34px; font-weight: 700; letter-spacing: .2em;
    color: var(--purple-d); background: var(--purple-l);
    border-radius: var(--radius-sm); padding: 16px;
    text-align: center; margin: 1rem 0;
  }

  .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

  .status-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 10px 14px; font-size: 13px; color: var(--muted);
    margin-bottom: 1rem;
  }

  .scoreboard {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.25rem;
  }
  .score-player { text-align: center; }
  .score-name { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .score-pts { font-size: 30px; font-weight: 700; }
  .you .score-name { color: var(--purple); }
  .you .score-pts  { color: var(--purple-d); }
  .opp .score-name { color: var(--teal); }
  .opp .score-pts  { color: var(--teal-d); }
  .score-vs { font-size: 13px; color: var(--hint); }

  .rounds { display: flex; gap: 5px; margin-bottom: 1.5rem; }
  .round-pip { flex: 1; height: 5px; border-radius: 3px; background: #e0e0e0; }
  .round-pip.done { background: var(--purple); }
  .round-pip.active { background: #AFA9EC; }

  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
  .choice-btn {
    border: 1.5px solid var(--border); border-radius: var(--radius);
    padding: 1.25rem 1rem; text-align: center; cursor: pointer;
    background: var(--surface); transition: border-color .15s, background .15s;
  }
  .choice-btn:hover { border-color: var(--purple); background: var(--purple-l); }
  .choice-btn.sel-c { border-color: var(--teal); background: var(--teal-l); }
  .choice-btn.sel-b { border-color: #E24B4A; background: var(--red-l); }
  .choice-icon { font-size: 32px; margin-bottom: 8px; }
  .choice-label { font-size: 15px; font-weight: 600; }
  .choice-hint  { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .history { margin-top: 1rem; }
  .history-title { font-size: 12px; color: var(--hint); margin-bottom: 6px; font-weight: 600; letter-spacing: .04em; }
  .history-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0; border-bottom: 0.5px solid var(--border);
    font-size: 13px;
  }
  .history-row:last-child { border-bottom: none; }
  .rn { font-size: 11px; color: var(--hint); min-width: 30px; }

  .badge { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; }
  .badge-c { background: var(--teal-l); color: var(--teal-d); }
  .badge-b { background: var(--red-l);  color: var(--red-d); }

  .arrow { color: var(--hint); font-size: 12px; }
  .pts-sm { margin-left: auto; font-size: 12px; color: var(--muted); }

  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
  .result-cell { border-radius: var(--radius-sm); padding: 14px; text-align: center; }
  .rc-you { background: var(--purple-l); }
  .rc-opp { background: var(--teal-l); }
  .rc-name { font-size: 11px; font-weight: 600; margin-bottom: 6px; }
  .rc-you .rc-name { color: var(--purple); }
  .rc-opp .rc-name { color: var(--teal); }
  .rc-pts { font-size: 28px; font-weight: 700; margin-top: 6px; }
  .rc-you .rc-pts { color: var(--purple-d); }
  .rc-opp .rc-pts { color: var(--teal-d); }

  .insight {
    background: var(--amber-l); border-radius: var(--radius-sm);
    padding: 10px 14px; font-size: 13px; color: var(--amber-d);
    line-height: 1.6; margin-bottom: 1rem;
  }

  .final-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; }
  .final-cell { background: var(--bg); border-radius: var(--radius-sm); padding: 1rem; }
  .final-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .fc-you .final-name { color: var(--purple); }
  .fc-opp .final-name { color: var(--teal); }
  .final-pts { font-size: 36px; font-weight: 700; }
  .fc-you .final-pts { color: var(--purple-d); }
  .fc-opp .final-pts { color: var(--teal-d); }
  .final-bar { height: 6px; border-radius: 3px; margin-top: 8px; background: #e0e0e0; overflow: hidden; }
  .final-fill-you { height: 100%; background: var(--purple); border-radius: 3px; }
  .final-fill-opp { height: 100%; background: var(--teal);   border-radius: 3px; }

  .verdict { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .verdict-sub { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; }

  .conn-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
  .conn-ok  { background: var(--teal); }
  .conn-bad { background: #E24B4A; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --surface: #242424; --border: rgba(255,255,255,.12);
      --text: #f0f0f0; --muted: #a0a0a0; --hint: #666;
      --purple-l: #2a2850; --purple-d: #c4bfff;
      --teal-l: #0d2e22; --teal-d: #6ee7bc;
      --red-l: #2e1010; --red-d: #f4a0a0;
      --amber-l: #2a1f00; --amber-d: #fcd97a;
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const TOTAL = 5;
const PAYOFF = { c:{c:[3,3],b:[0,5]}, b:{c:[5,0],b:[1,1]} };

const S = {
  screen: 'lobby',
  ws: null,
  connected: false,
  role: null,
  roomId: null,
  myName: '', oppName: '',
  myScore: 0, oppScore: 0,
  round: 0,
  myChoice: null,
  waitingOpp: false,
  oppChose: false,
  history: [],
  lastResult: null,
  errMsg: '',
  serverUrl: '',
};

// ── WebSocket ─────────────────────────────────
function connect(url, onOpen) {
  if (S.ws) { S.ws.onclose = null; S.ws.close(); }
  S.ws = new WebSocket(url);
  S.ws.onopen = () => {
    S.connected = true;
    S.serverUrl = url;
    if (onOpen) onOpen();
  };
  S.ws.onmessage = (e) => handle(JSON.parse(e.data));
  S.ws.onerror   = () => showErr('無法連接伺服器，請確認伺服器網址');
  S.ws.onclose   = () => {
    S.connected = false;
    if (S.screen !== 'lobby') {
      S.screen = 'lobby';
      S.errMsg = '與伺服器的連線中斷';
      render();
    }
  };
}

function send(obj) {
  if (S.ws && S.ws.readyState === 1) S.ws.send(JSON.stringify(obj));
}

function handle(msg) {
  switch (msg.type) {

    case 'room_created':
      S.role = 'p1'; S.roomId = msg.roomId;
      S.myScore = 0; S.oppScore = 0; S.round = 0; S.history = [];
      S.screen = 'waiting'; render(); break;

    case 'opponent_joined':
      S.oppName = S.role === 'p1' ? msg.p2Name : msg.p1Name;
      S.screen = 'game'; render(); break;

    case 'joined':
      S.role = 'p2'; S.roomId = msg.id ?? msg.roomId;
      S.oppName = msg.p1Name;
      S.myScore = 0; S.oppScore = 0; S.round = 0; S.history = [];
      S.screen = 'game'; render(); break;

    case 'choice_ack':
      S.waitingOpp = true; render(); break;

    case 'opponent_chose':
      S.oppChose = true; render(); break;

    case 'round_result': {
      const myC  = S.role === 'p1' ? msg.p1Choice : msg.p2Choice;
      const oppC = S.role === 'p1' ? msg.p2Choice : msg.p1Choice;
      const myP  = S.role === 'p1' ? msg.p1pts    : msg.p2pts;
      const oppP = S.role === 'p1' ? msg.p2pts     : msg.p1pts;
      S.myScore  = S.role === 'p1' ? msg.p1Score  : msg.p2Score;
      S.oppScore = S.role === 'p1' ? msg.p2Score   : msg.p1Score;
      S.round    = msg.round;
      S.history  = msg.history;
      S.lastResult = { myC, oppC, myP, oppP, finished: msg.finished, winner: msg.winner };
      S.myChoice = null; S.waitingOpp = false; S.oppChose = false;
      S.screen = 'roundResult'; render(); break;
    }

    case 'opponent_disconnected':
      S.screen = 'lobby'; S.errMsg = '對手已離線，遊戲結束'; render(); break;

    case 'error':
      showErr(msg.msg); break;
  }
}

function showErr(m) { S.errMsg = m; render(); }

// ── Render ────────────────────────────────────
function render() {
  document.getElementById('app').innerHTML = ({
    lobby:       renderLobby,
    waiting:     renderWaiting,
    game:        renderGame,
    roundResult: renderRoundResult,
    final:       renderFinal,
  }[S.screen] || renderLobby)();
  attachEvents();
}

function connBadge() {
  return S.connected
    ? `<span class="conn-dot conn-ok"></span><span style="font-size:12px;color:var(--muted)">已連線</span>`
    : `<span class="conn-dot conn-bad"></span><span style="font-size:12px;color:var(--muted)">未連線</span>`;
}

function renderLobby() {
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <h1>囚徒困境對戰</h1>
      <div>${connBadge()}</div>
    </div>
    <p class="sub">5 輪即時雙人賽局，合作或背叛？</p>

    ${S.errMsg ? `<div class="error" style="display:block">${S.errMsg}</div>` : ''}

    <label>伺服器網址（WebSocket）</label>
    <input type="text" id="inp-url" placeholder="ws://localhost:3000" value="${S.serverUrl}">

    <label>你的名稱</label>
    <input type="text" id="inp-name" placeholder="輸入名稱" maxlength="12" value="${S.myName}">

    <label>密碼</label>
    <input type="password" id="inp-pw" placeholder="設定或輸入密碼" maxlength="20">

    <button class="btn btn-primary" id="btn-create">＋ 創建房間</button>

    <div class="divider"><hr><span>或加入現有房間</span><hr></div>

    <label>4 碼房間代碼</label>
    <input type="text" id="inp-room" placeholder="例如：A3BX" maxlength="4"
           style="text-transform:uppercase;letter-spacing:.15em;font-weight:700;font-size:18px;">

    <button class="btn btn-secondary" id="btn-join">進入房間 →</button>
  </div>`;
}

function renderWaiting() {
  return `
  <div class="card">
    <h2>等待對手加入</h2>
    <p class="sub">把以下代碼和密碼傳給對手。</p>
    <div class="room-code">${S.roomId}</div>
    <div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:1.5rem;">
      伺服器：${S.serverUrl}
    </div>
    <div class="status-bar"><span class="pulse"></span>等待對手連線中…</div>
    <button class="btn btn-secondary" id="btn-copy">複製房間代碼</button>
    <button class="btn btn-secondary" id="btn-cancel">取消</button>
  </div>`;
}

function renderGame() {
  const pips = Array.from({length:TOTAL},(_,i) =>
    `<div class="round-pip ${i<S.round?'done':i===S.round?'active':''}"></div>`
  ).join('');

  const histRows = S.history.map((h, i) => {
    const myC  = S.role==='p1' ? h.p1Choice : h.p2Choice;
    const oppC = S.role==='p1' ? h.p2Choice : h.p1Choice;
    const myP  = S.role==='p1' ? h.p1pts    : h.p2pts;
    return `<div class="history-row">
      <span class="rn">輪 ${i+1}</span>
      <span class="badge badge-${myC}">${myC==='c'?'合作':'背叛'}</span>
      <span class="arrow">→</span>
      <span class="badge badge-${oppC}">${oppC==='c'?'合作':'背叛'}</span>
      <span class="pts-sm">你 +${myP}</span>
    </div>`;
  }).join('') || `<div style="font-size:12px;color:var(--hint)">尚無歷史</div>`;

  const oppStatus = S.oppChose
    ? `<span style="color:var(--teal);font-weight:600;">對手已選擇 ✓</span>`
    : `<span style="color:var(--hint);">等待對手選擇…</span>`;

  return `
  <div>
    <div class="scoreboard">
      <div class="score-player you">
        <div class="score-name">${S.myName}（你）</div>
        <div class="score-pts">${S.myScore}</div>
      </div>
      <div class="score-vs">第 ${S.round+1} / ${TOTAL} 輪</div>
      <div class="score-player opp">
        <div class="score-name">${S.oppName}</div>
        <div class="score-pts">${S.oppScore}</div>
      </div>
    </div>

    <div class="rounds">${pips}</div>

    <div class="card" style="margin-bottom:1rem;">
      <h2 style="margin-bottom:4px;">選擇你的行動</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:1rem;">對手不會提前看到你的選擇。</p>
      <div class="choice-grid">
        <div class="choice-btn ${S.myChoice==='c'?'sel-c':''}" id="btn-c">
          <div class="choice-icon">🤝</div>
          <div class="choice-label">合作</div>
          <div class="choice-hint">雙合作各 +3</div>
        </div>
        <div class="choice-btn ${S.myChoice==='b'?'sel-b':''}" id="btn-b">
          <div class="choice-icon">🗡️</div>
          <div class="choice-label">背叛</div>
          <div class="choice-hint">背叛可得 +5</div>
        </div>
      </div>

      ${S.waitingOpp
        ? `<div class="status-bar" style="margin-bottom:0"><span class="pulse"></span>已送出，${oppStatus}</div>`
        : `<button class="btn btn-primary" id="btn-submit" ${!S.myChoice?'disabled':''}>確認送出</button>`
      }
    </div>

    <div class="history">
      <div class="history-title">本局歷史</div>
      ${histRows}
    </div>
  </div>`;
}

function renderRoundResult() {
  const {myC, oppC, myP, oppP, finished} = S.lastResult;
  const insight =
    myC==='c'&&oppC==='c' ? '雙方合作！集體最優，Nash 均衡外更好的結果。' :
    myC==='b'&&oppC==='b' ? '雙方背叛。Nash 均衡——個人理性，集體虧損。' :
    myC==='b'&&oppC==='c' ? '你背叛了對手，獲得本輪最高個人分。' :
                            '對手背叛了你，你得 0 分。';
  return `
  <div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:1rem;">第 ${S.round} 輪結果</div>
    <div class="result-grid">
      <div class="result-cell rc-you">
        <div class="rc-name">${S.myName}（你）</div>
        <span class="badge badge-${myC}">${myC==='c'?'合作':'背叛'}</span>
        <div class="rc-pts">+${myP}</div>
      </div>
      <div class="result-cell rc-opp">
        <div class="rc-name">${S.oppName}</div>
        <span class="badge badge-${oppC}">${oppC==='c'?'合作':'背叛'}</span>
        <div class="rc-pts">+${oppP}</div>
      </div>
    </div>
    <div class="insight">${insight}</div>
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-top:.5px solid var(--border);margin-bottom:1rem;font-size:13px;color:var(--muted);">
      <span>累計：<strong style="color:var(--purple-d)">${S.myName} ${S.myScore}</strong></span>
      <span><strong style="color:var(--teal-d)">${S.oppName} ${S.oppScore}</strong></span>
    </div>
    <button class="btn btn-primary" id="btn-next">${finished?'查看最終結果 →':'下一輪 →'}</button>
  </div>`;
}

function renderFinal() {
  const max = TOTAL * 5;
  const myPct  = Math.round(S.myScore  / max * 100);
  const oppPct = Math.round(S.oppScore / max * 100);
  const {winner} = S.lastResult;
  const verdict =
    winner==='tie' ? '平局！' :
    (winner==='p1' && S.role==='p1') || (winner==='p2' && S.role==='p2')
      ? `${S.myName} 獲勝！🎉` : `${S.oppName} 獲勝`;

  const myCollabs  = S.history.filter(h => (S.role==='p1'?h.p1Choice:h.p2Choice) === 'c').length;
  const oppCollabs = S.history.filter(h => (S.role==='p1'?h.p2Choice:h.p1Choice) === 'c').length;

  const histRows = S.history.map((h, i) => {
    const myC = S.role==='p1' ? h.p1Choice : h.p2Choice;
    const oppC= S.role==='p1' ? h.p2Choice : h.p1Choice;
    const myP = S.role==='p1' ? h.p1pts    : h.p2pts;
    return `<div class="history-row">
      <span class="rn">輪 ${i+1}</span>
      <span class="badge badge-${myC}">${myC==='c'?'合作':'背叛'}</span>
      <span class="arrow">→</span>
      <span class="badge badge-${oppC}">${oppC==='c'?'合作':'背叛'}</span>
      <span class="pts-sm">你 +${myP}</span>
    </div>`;
  }).join('');

  return `
  <div>
    <div class="verdict">${verdict}</div>
    <div class="verdict-sub">5 輪對戰結束</div>

    <div class="final-row">
      <div class="final-cell fc-you">
        <div class="final-name">${S.myName}（你）</div>
        <div class="final-pts">${S.myScore}</div>
        <div style="font-size:11px;color:var(--hint)">合作 ${myCollabs} 次</div>
        <div class="final-bar"><div class="final-fill-you" style="width:${myPct}%"></div></div>
      </div>
      <div class="final-cell fc-opp">
        <div class="final-name">${S.oppName}</div>
        <div class="final-pts">${S.oppScore}</div>
        <div style="font-size:11px;color:var(--hint)">合作 ${oppCollabs} 次</div>
        <div class="final-bar"><div class="final-fill-opp" style="width:${oppPct}%"></div></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:1rem;">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;">完整對局歷史</div>
      ${histRows}
    </div>

    <button class="btn btn-primary" id="btn-again">再玩一局</button>
  </div>`;
}

// ── 事件綁定 ──────────────────────────────────
function attachEvents() {
  S.errMsg = '';

  const $ = id => document.getElementById(id);

  if (S.screen === 'lobby') {
    $('btn-create')?.addEventListener('click', () => {
      const url  = $('inp-url').value.trim();
      const name = $('inp-name').value.trim();
      const pw   = $('inp-pw').value.trim();
      if (!url)  { showErr('請輸入伺服器網址'); return; }
      if (!name) { showErr('請輸入名稱'); return; }
      if (!pw)   { showErr('請輸入密碼'); return; }
      S.myName = name;
      if (!S.connected || S.serverUrl !== url) {
        connect(url, () => send({ type:'create_room', name, password:pw }));
      } else {
        send({ type:'create_room', name, password:pw });
      }
    });

    $('btn-join')?.addEventListener('click', () => {
      const url    = $('inp-url').value.trim();
      const name   = $('inp-name').value.trim();
      const pw     = $('inp-pw').value.trim();
      const roomId = $('inp-room').value.trim().toUpperCase();
      if (!url)    { showErr('請輸入伺服器網址'); return; }
      if (!name)   { showErr('請輸入名稱'); return; }
      if (!pw)     { showErr('請輸入密碼'); return; }
      if (roomId.length !== 4) { showErr('房間代碼需為 4 碼'); return; }
      S.myName = name;
      if (!S.connected || S.serverUrl !== url) {
        connect(url, () => send({ type:'join_room', name, password:pw, roomId }));
      } else {
        send({ type:'join_room', name, password:pw, roomId });
      }
    });
  }

  if (S.screen === 'waiting') {
    $('btn-copy')?.addEventListener('click', () => {
      navigator.clipboard.writeText(S.roomId).catch(()=>{});
      $('btn-copy').textContent = '已複製 ✓';
    });
    $('btn-cancel')?.addEventListener('click', () => {
      if (S.ws) S.ws.close();
      S.screen = 'lobby'; render();
    });
  }

  if (S.screen === 'game') {
    $('btn-c')?.addEventListener('click', () => { if(!S.waitingOpp){ S.myChoice='c'; render(); } });
    $('btn-b')?.addEventListener('click', () => { if(!S.waitingOpp){ S.myChoice='b'; render(); } });
    $('btn-submit')?.addEventListener('click', () => {
      if (!S.myChoice || S.waitingOpp) return;
      send({ type:'choose', choice: S.myChoice });
    });
  }

  if (S.screen === 'roundResult') {
    $('btn-next')?.addEventListener('click', () => {
      if (S.lastResult.finished) { S.screen = 'final'; render(); }
      else { S.screen = 'game'; render(); }
    });
  }

  if (S.screen === 'final') {
    $('btn-again')?.addEventListener('click', () => {
      S.screen = 'lobby'; S.round = 0;
      S.myScore = 0; S.oppScore = 0;
      S.history = []; S.myChoice = null;
      S.waitingOpp = false; S.oppChose = false;
      render();
    });
  }
}

render();
</script>
</body>
</html>
